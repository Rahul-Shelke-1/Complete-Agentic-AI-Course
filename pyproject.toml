[project]
name = "complete-agentic-ai-course"
version = "0.1.0"
description = "This is a complete course on learning Generative ai and agentic with Langchain and Langgraph. We have included all the topics from RAG, vectorless rag, Deep agents, Guardrails, LLM Evaluation and LLM Gateways Techniques"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]
